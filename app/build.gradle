plugins {
    id 'com.android.application'
}

// Version: "<versionBase>.<build>" where <build> is the GitHub Actions run number.
// versionCode must always increase so the in-app updater (and Android) accept new builds.
def versionBase = '1.0'
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// app/framedash.keystore is created by the first CI run (see build.yml), locked with
// GitHub Actions secret FRAMEDASH_KEYSTORE_PASSWORD.
def ksPassword = System.getenv('FRAMEDASH_KEYSTORE_PASSWORD')

android {
    namespace 'app.framedash'
    compileSdk 34

    defaultConfig {
        applicationId 'app.framedash'
        // The fridge reportedly runs Android 9 (API 28). targetSdk 28 matches the
        // device so no newer-platform behaviour changes apply.
        minSdk 24
        targetSdk 28
        versionCode buildNumber
        versionName "${versionBase}.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('framedash.keystore')
            storePassword ksPassword
            keyAlias 'framedash'
            keyPassword ksPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPassword ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // WebSocket client for the voice call. Pure Java/Kotlin, no Google services.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
// Otherwise no dependencies on purpose: no AndroidX, no Google Play Services.
